<script>
// ---- Acceso (mail autorizado + contraseña). El Worker valida; acá solo se guarda el token de sesión (12 hs).
(function () {
  var API = "https://nc-silver-api.diegortizdao.workers.dev/api";
  var KEY = "sgc_nc_token";
  function leer() { try { var t = JSON.parse(localStorage.getItem(KEY) || "null"); return t && t.expira > Date.now() ? t : null; } catch (e) { return null; } }
  function guardar(t) { try { localStorage.setItem(KEY, JSON.stringify(t)); } catch (e) {} }
  function borrar() { try { localStorage.removeItem(KEY); } catch (e) {} }
  window.cerrarSesionNC = function () { borrar(); location.reload(); };
  window.usuarioNC = function () { var t = leer(); return t ? t.email : null; };

  var f0 = window.fetch.bind(window);
  window.fetch = function (url, opts) {
    if (typeof url === "string" && url.indexOf(API) === 0 && url.indexOf(API + "/login") !== 0) {
      var t = leer(); opts = opts || {}; opts.headers = Object.assign({}, opts.headers || {});
      // Sin sesión no se llama a la API (la app queda oculta detrás del login): evita el bucle de recargas.
      if (!t) return Promise.reject(new Error("Sin sesión"));
      opts.headers["Authorization"] = "Bearer " + t.token;
      return f0(url, opts).then(function (r) {
        if (r.status === 401) {
          borrar();
          var n = Number(sessionStorage.getItem("sgc_nc_reload") || 0);
          if (Date.now() - n > 10000) { sessionStorage.setItem("sgc_nc_reload", String(Date.now())); location.reload(); }
        }
        return r;
      });
    }
    return f0(url, opts);
  };

  if (leer()) return;
  document.addEventListener("DOMContentLoaded", function () {
    var root = document.getElementById("root"); if (root) root.style.display = "none";
    var d = document.createElement("div");
    d.style.cssText = "min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f1f5f9;font-family:system-ui,sans-serif";
    d.innerHTML = '<form id="nc-login" style="background:#fff;padding:28px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.1);width:min(92vw,360px)">' +
      '<h2 style="margin:0 0 4px;font-size:18px;color:#1e293b">SGC Silver Industrial</h2><p style="margin:0 0 16px;font-size:13px;color:#64748b">Acceso restringido. Ingresá con tu mail autorizado.</p>' +
      '<input id="nc-mail" type="email" placeholder="Mail" autocomplete="username" required style="width:100%;box-sizing:border-box;padding:10px;margin-bottom:10px;border:1px solid #cbd5e1;border-radius:8px">' +
      '<input id="nc-pass" type="password" placeholder="Contraseña" autocomplete="current-password" required style="width:100%;box-sizing:border-box;padding:10px;margin-bottom:10px;border:1px solid #cbd5e1;border-radius:8px">' +
      '<button style="width:100%;padding:10px;border:0;border-radius:8px;background:#1e293b;color:#fff;font-size:15px;cursor:pointer">Ingresar</button>' +
      '<p id="nc-err" style="color:#b91c1c;font-size:13px;min-height:18px;margin:10px 0 0"></p></form>';
    document.body.appendChild(d);
    d.querySelector("form").addEventListener("submit", function (e) {
      e.preventDefault(); var err = d.querySelector("#nc-err"); err.textContent = "Verificando...";
      f0(API + "/login", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email: d.querySelector("#nc-mail").value, password: d.querySelector("#nc-pass").value }) })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (x) { if (!x.ok) { err.textContent = x.j.error || "No se pudo ingresar"; return; } guardar({ token: x.j.token, email: x.j.email, expira: x.j.expira }); location.reload(); })
        .catch(function () { err.textContent = "No se pudo conectar con el servidor"; });
    });
  });
})();
</script>

<script type="text/babel" data-presets="react">
const { useState, useEffect } = React;

const API_BASE = "https://nc-silver-api.diegortizdao.workers.dev/api";

async function apiGet(path) {
  const res = await fetch(`${API_BASE}${path}`);
  if (!res.ok) throw new Error(`Error al consultar la base (${res.status})`);
  return res.json();
}

async function apiPost(path, body) {
  const res = await fetch(`${API_BASE}${path}`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) { const j = await res.json().catch(() => null); throw new Error((j && j.error) || `Error al guardar (${res.status})`); }
  return res.json();
}

async function apiPut(path, body) {
  const res = await fetch(`${API_BASE}${path}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  if (!res.ok) { const j = await res.json().catch(() => null); throw new Error((j && j.error) || `Error al guardar (${res.status})`); }
  return res.json();
}

// Convierte una fila de la base (snake_case) al formato que usan los formularios (camelCase)
function mapNCFromApi(row) {
  return {
    numero: row.numero,
    // Las NC migradas del histórico Q.11 guardan acá el número real (el que usás
    // en tus registros); las NC nuevas no tienen esto, así que se muestra "numero".
    numeroOriginal: row.numero_original || null,
    numeroMostrar: row.numero_original || row.numero,
    cargadoPor: row.cargado_por_apellido || "",
    tipo: row.tipo,
    categoria: row.categoria,
    cliente: row.cliente || "",
    producto: row.producto,
    descripcion: row.descripcion,
    fechaProduccion: row.fecha_produccion || "",
    operario: row.operario || "",
    maquina: row.maquina || "",
    oti: row.oti || "",
    cantidadPiezas: row.cantidad_piezas || "",
    disposicion: row.disposicion,
    fechaProgramada: row.fecha_programada || "",
    cumplido: row.cumplido || "",
    fechaCumplimiento: row.fecha_cumplimiento || "",
    requiereAccion: row.requiere_accion || "",
    estado: row.estado || "Abierta",
    clasificacion: row.clasificacion || "",
    conDevolucion: row.con_devolucion === true ? "Sí" : row.con_devolucion === false ? "No" : "",
  };
}

function mapAnalisisFromApi(row) {
  if (!row) return null;
  return {
    numeroNC: String(row.nc_numero),
    porques: [row.porque1 || "", row.porque2 || "", row.porque3 || "", row.porque4 || "", row.porque5 || ""],
    causaRaiz: row.causa_raiz || "",
    modificarDocumento: row.modificar_documento || "",
    documentoDetalle: row.documento_detalle || "",
    accionDescripcion: row.accion_descripcion || "",
    responsable: row.responsable || "",
    fechaProgramadaAccion: row.fecha_programada_accion || "",
    fechaVerifCumplimiento: row.fecha_verif_cumplimiento || "",
    evidenciaCumplimiento: row.evidencia_cumplimiento || "",
    fechaVerifEficacia: row.fecha_verif_eficacia || "",
    evidenciaEficacia: row.evidencia_eficacia || "",
    noRequiereNotificacion: row.no_requiere_notificacion || false,
    estado: row.estado || "Abierta",
    costoAsociado: row.costo_asociado != null ? String(row.costo_asociado) : "",
  };
}

function Header() {
  return (
    <div className="flex items-center justify-between mb-6 pb-4 border-b border-slate-200">
      <img src={LOGO_SILVER} alt="Silver Industrial" className="h-10" />
      <img src={BADGE_ISO} alt="Certified ISO 9001:2015 Bureau Veritas" className="h-10" />
    </div>
  );
}

function Bloque1({ registros, recargarRegistros }) {
  const [form, setForm] = useState(emptyForm);
  const [error, setError] = useState("");
  const [nextNumero, setNextNumero] = useState(null);
  const [nextInterno, setNextInterno] = useState(null);
  const [guardando, setGuardando] = useState(false);
  const [guardadoOk, setGuardadoOk] = useState(false);
  const [claseGuardada, setClaseGuardada] = useState("");
  const esOM = form.tipo === TIPO_OM;
  const esHA = form.tipo === TIPO_HA;
  const serieTipo = esOM ? "om" : esHA ? "ha" : null;
  const [numeroSerie, setNumeroSerie] = useState("");
  const claseEfectiva = esOM ? "" : form.clasificacion || sugerirClase(form);

  async function cargarProximoNumero() {
    try {
      // Cada tipo de informe tiene su propia numeración: las OM van aparte de las NC.
      const data = await apiGet(`/nc/proximo-numero${serieTipo ? "?tipo=" + serieTipo : ""}`);
      setNextNumero(data.siguiente);
      setNextInterno(data.numeroInterno || data.siguiente);
      setNumeroSerie(String(data.siguiente));
    } catch (e) {
      setError("No se pudo consultar el próximo número: " + e.message);
    }
  }

  useEffect(() => {
    setNextNumero(null);
    cargarProximoNumero();
  }, [serieTipo]);

  function update(field, value) {
    // Al cambiar tipo o categoría vuelve a valer la clasificación sugerida
    setForm((f) => ({ ...f, [field]: value, ...(field === "tipo" || field === "categoria" ? { clasificacion: "", conDevolucion: "" } : {}) }));
  }

  function validar() {
    // Las OM (ya aplicadas) y los hallazgos de auditoría no tienen operario, máquina ni OTI.
    const requeridos = esOM || esHA ? ["cargadoPor", "producto", "descripcion", "disposicion"] : ["cargadoPor", "producto", "descripcion", "operario", "maquina", "oti", "disposicion"];
    for (const campo of requeridos) {
      if (!form[campo]) return false;
    }
    if (claseEfectiva === "Reclamos de Clientes" && !form.conDevolucion) return false;
    return true;
  }

  async function handleSubmit() {
    if (!validar()) {
      setError("Completá quién carga, producto, descripción, operario, máquina, OTI y disposición antes de guardar" + (claseEfectiva === "Reclamos de Clientes" ? " (y si el reclamo tuvo devolución)." : "."));
      return;
    }
    if (!nextNumero) {
      setError("Todavía no se cargó el número — esperá un segundo e intentá de nuevo.");
      return;
    }
    if (esOM && !(Number(numeroSerie) > 0)) {
      setError("Indicá el número de la OM.");
      return;
    }
    setError("");
    setGuardando(true);
    setGuardadoOk(false);
    try {
      const cargador = CARGADORES.find((c) => c.apellido === form.cargadoPor);
      const operarioSel = OPERARIOS.find((o) => o.nombre === form.operario);
      const creada = await apiPost("/nc", {
        ...form,
        // Las OM se cargan ya aplicadas: no hay propuesta ni verificación posterior
        requiereAccion: esOM ? "No" : form.requiereAccion,
        numeroSerie: serieTipo ? Number(numeroSerie) : undefined,
        clasificacion: claseEfectiva || null,
        conDevolucion: claseEfectiva === "Reclamos de Clientes" ? form.conDevolucion === "Sí" : null,
        numero: nextInterno,
        cargadoPorApellido: cargador ? cargador.apellido : null,
        cargadoPorNombre: cargador ? cargador.nombre : null,
        operarioLegajo: operarioSel && operarioSel.legajo ? operarioSel.legajo : null,
      });
      // Primer snapshot del Q.21 (todavía sin Bloque 2) — así el dashboard ya tiene
      // un documento para linkear desde el momento en que se carga la NC.
      if (esOM) {
        // Estado "Aplicada" en todas las OM (se cargan las que ya están funcionando)
        await apiPut(`/nc/${creada.numero}/analisis`, { estado: "Aplicada", noRequiereNotificacion: true });
      }
      guardarSnapshotWord(creada.numero, armarDatosWord(form, creada.numero_original || creada.numero, null), false);
      setClaseGuardada(claseEfectiva || "");

function base64ToUint8Array(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

// Los cuadraditos de la plantilla Q.21 (checkboxes) se convierten en un punto azul en la opción elegida.
const _norm = (v) => String(v || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().trim();
function marcarOpcionesQ21(xml, d) {
  const sel = [];
  const t = _norm(d.tipoSeleccionado);
  sel.push(t.startsWith("hallazgo") ? "1077" : t.startsWith("op") ? "1078" : t.startsWith("no conf") ? "1076" : null);
  const c = _norm(d.categoriaSeleccionada);
  if (d.esOM) {
    // En el Q.21.B la fila de categorías es el ORIGEN: Auditoría / Problema / FODA / Idea / Otros
    const o = _norm(d.origenOM);
    sel.push(o.startsWith("hallazgo") || o.startsWith("audit") ? "1079" : o.startsWith("problema") ? "1083" : o.includes("foda") ? "1080" : o.startsWith("idea") ? "1081" : o ? "1082" : null);
  } else {
    sel.push({ producto: "1079", proceso: "1083", proveedor: "1080", cliente: "1081", otros: "1082" }[c] || null);
  }
  const cu = _norm(d.cumplidoTexto);
  sel.push(cu === "si" ? "1046" : cu === "no" ? "1047" : null);
  const rq = _norm(d.requiereTexto);
  sel.push(rq === "si" ? "1048" : rq === "no" ? "1049" : null);
  sel.filter(Boolean).forEach((n) => {
    const re = new RegExp(`<v:rect id="_x0000_s${n}" style="([^"]*)"\\s*/>`);
    xml = xml.replace(re, (m, st) => `<v:oval id="_x0000_s${n}" style="${st}" fillcolor="#1f6fd0" strokecolor="#174a96" strokeweight=".5pt"/>`);
  });
  return xml;
}

// ---- Firmas digitales (imágenes PNG guardadas en R2, vía el Worker; solo cuentas autorizadas) ----
// - Emisor de la NC (Ortigoza / Canaberro / Pardo / Ortiz): firma en el primer "FIRMA RESPONSABLE".
// - Gestión de Calidad (Diego Ortiz): firma en las verificaciones de cumplimiento y de eficacia.
let _listaFirmasP = null;
const _firmaCache = {};
function _normF(t) { return String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function listaFirmas() {
  if (!_listaFirmasP) {
    _listaFirmasP = (async () => {
      try {
        const lr = await fetch(`${API_BASE}/firmas`);
        return lr.ok ? await lr.json() : [];
      } catch (e) { return []; }
    })();
  }
  return _listaFirmasP;
}
// apellido: "Ortigoza", "Canaberro", "Ortiz"... Busca en id y nombre de la firma cargada (tolera Ortigosa/Ortigoza).
function obtenerFirmaDe(apellido) {
  const ap = _normF(apellido).replace(/z$/, "[zs]");
  if (!ap) return Promise.resolve(null);
  if (_firmaCache[ap]) return _firmaCache[ap];
  _firmaCache[ap] = (async () => {
    try {
      const lista = await listaFirmas();
      const re = new RegExp(ap);
      const f = lista.find((x) => re.test(_normF(`${x.id} ${x.nombre}`)));
      if (!f) return null;
      const r = await fetch(`${API_BASE}/firmas/${encodeURIComponent(f.id)}`);
      if (!r.ok) return null;
      const b = new Uint8Array(await r.arrayBuffer());
      const dv = new DataView(b.buffer);
      return { bytes: b, w: dv.getUint32(16), h: dv.getUint32(20) };
    } catch (e) { return null; }
  })();
  return _firmaCache[ap];
}
const obtenerFirmaCalidad = () => obtenerFirmaDe("Ortiz");

function _anchorFirma(firma, rid, id, nombre, dx, dy) {
  const alto = 330000; // ~0,9 cm
  let ancho = Math.round(alto * (firma.w / firma.h));
  let altoF = alto;
  if (ancho > 1080000) { ancho = 1080000; altoF = Math.round(ancho * (firma.h / firma.w)); }
  // Imagen flotante (no empuja el texto: el Q.21 sigue entrando en una hoja). dx = distancia desde el margen izquierdo.
  return `<w:r><w:drawing><wp:anchor distT="0" distB="0" distL="0" distR="0" simplePos="0" relativeHeight="25170${id}" behindDoc="0" locked="0" layoutInCell="1" allowOverlap="1"><wp:simplePos x="0" y="0"/><wp:positionH relativeFrom="column"><wp:posOffset>${dx}</wp:posOffset></wp:positionH><wp:positionV relativeFrom="paragraph"><wp:posOffset>${dy}</wp:posOffset></wp:positionV><wp:extent cx="${ancho}" cy="${altoF}"/><wp:effectExtent l="0" t="0" r="0" b="0"/><wp:wrapNone/><wp:docPr id="${id}" name="${nombre}"/><wp:cNvGraphicFramePr/><a:graphic xmlns:a="http://schemas.openxmlformats.org/drawingml/2006/main"><a:graphicData uri="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:pic xmlns:pic="http://schemas.openxmlformats.org/drawingml/2006/picture"><pic:nvPicPr><pic:cNvPr id="${id}" name="${rid}.png"/><pic:cNvPicPr/></pic:nvPicPr><pic:blipFill><a:blip r:embed="${rid}"/><a:stretch><a:fillRect/></a:stretch></pic:blipFill><pic:spPr><a:xfrm><a:off x="0" y="0"/><a:ext cx="${ancho}" cy="${altoF}"/></a:xfrm><a:prstGeom prst="rect"><a:avLst/></a:prstGeom></pic:spPr></pic:pic></a:graphicData></a:graphic></wp:anchor></w:drawing></w:r>`;
}
function _registrarImagen(zip, rid, firma) {
  zip.file(`word/media/${rid}.png`, firma.bytes);
  const relsPath = "word/_rels/document.xml.rels";
  const rels = zip.file(relsPath).asText();
  if (!rels.includes(`Id="${rid}"`)) {
    zip.file(relsPath, rels.replace("</Relationships>", `<Relationship Id="${rid}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/image" Target="media/${rid}.png"/></Relationships>`));
  }
}
// Firma del emisor: va en el renglón de puntos que está sobre el primer "FIRMA RESPONSABLE / ACLARACIÓN".
function insertarFirmaEmisor(zip, xml, firma) {
  const paras = xml.split("</w:p>");
  for (let i = 0; i < paras.length - 1; i++) {
    const sig = paras[i + 1].replace(/<[^>]+>/g, "");
    if (/FIRMA RESPONSABLE\s+ACLARACI/.test(sig)) {
      paras[i] += _anchorFirma(firma, "rIdFirmaEmisor", 9102, "Firma emisor", 120000, -230000);
      _registrarImagen(zip, "rIdFirmaEmisor", firma);
      return paras.join("</w:p>");
    }
  }
  return xml;
}
function insertarFirmaCalidad(zip, xml, firma, data) {
  const paras = xml.split("</w:p>");
  let idx = 0, usada = false;
  for (let i = 0; i < paras.length; i++) {
    if (/FIRMA DE GESTI/.test(paras[i].replace(/<[^>]+>/g, ""))) {
      const verificada = idx === 0 ? data.fechaVerifCumplimiento : data.fechaVerifEficacia;
      idx++;
      if (verificada) { paras[i] += _anchorFirma(firma, "rIdFirmaCalidad", 9101, "Firma Gestión de Calidad", idx === 1 ? 5350000 : 4050000, -190000); usada = true; }
    }
  }
  if (!usada) return xml;
  _registrarImagen(zip, "rIdFirmaCalidad", firma);
  return paras.join("</w:p>");

async function generarWordBlobNC(data) {
  const [{ default: PizZip }, { default: Docxtemplater }] = await Promise.all([
    import("https://esm.sh/pizzip@3.1.6"),
    import("https://esm.sh/docxtemplater@3.69.3"),
  ]);
  const bytes = base64ToUint8Array(data.esOM ? Q21B_TEMPLATE_B64 : Q21_TEMPLATE_B64);
  const zip = new PizZip(bytes);
  const doc = new Docxtemplater(zip, { paragraphLoop: true, linebreaks: true });
  doc.render(data);
  try {
    const zz = doc.getZip();
    let xmlF = marcarOpcionesQ21(zz.file("word/document.xml").asText(), data);
    if (data.cargadoPor) {
      const fe = await obtenerFirmaDe(data.cargadoPor);
      if (fe) xmlF = insertarFirmaEmisor(zz, xmlF, fe);
    }
    if (data.fechaVerifCumplimiento || data.fechaVerifEficacia) {
      const firma = await obtenerFirmaCalidad();
      if (firma) xmlF = insertarFirmaCalidad(zz, xmlF, firma, data);
    }
    zz.file("word/document.xml", xmlF);
  } catch (e) { console.warn("No se pudieron marcar las opciones:", e.message); }
  return doc.getZip().generate({
    type: "blob",
    mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
  });
}

function descargarBlob(blob, nombreArchivo) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = nombreArchivo;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

async function generarWordNC(data, nombreArchivo) {
  const blob = await generarWordBlobNC(data);
  descargarBlob(blob, nombreArchivo);
}

// Guarda (o pisa) el snapshot Q.21 de esta NC en el bucket R2, vía el Worker.
// Es el registro "oficial" que se linkea desde el dashboard Q.11 para el auditor.
// No bloqueante: si falla, no impide guardar la NC — solo se avisa por consola.
// congelar=true fija el documento para siempre (se llama cuando el estado pasa a "Cerrada").
async function guardarSnapshotWord(numero, datos, congelar) {
  try {
    const blob = await generarWordBlobNC(datos);
    const url = `${API_BASE}/nc/${numero}/documento${congelar ? "?congelar=1" : ""}`;
    const res = await fetch(url, {
      method: "PUT",
      headers: { "Content-Type": "application/vnd.openxmlformats-officedocument.wordprocessingml.document" },
      body: blob,
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      console.warn("No se pudo guardar el snapshot del Word:", data.error || res.status);
      return false;
    }
    return true;
  } catch (e) {
    console.warn("No se pudo generar/guardar el snapshot del Word:", e.message);
    return false;
  }
}

function FotoAdjuntos() {
  const [fotos, setFotos] = useState([]);

  function handleFiles(e) {
    const archivos = Array.from(e.target.files || []);
    const nuevas = archivos.map((f) => ({
      id: `${f.name}-${Date.now()}-${Math.random()}`,
      url: URL.createObjectURL(f),

const hoyISO = () => new Date(Date.now() - 3 * 3600 * 1000).toISOString().slice(0, 10);
const fmtD = (v) => { const m = String(v || "").match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? `${m[3]}/${m[2]}/${m[1]}` : ""; };
const fmtDT = (v) => { if (!v) return ""; const d = new Date(v); return isNaN(d) ? "" : d.toLocaleString("es-AR", { timeZone: "America/Argentina/Buenos_Aires", day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" }); };
const MOTIVO_REGULARIZACION = "Regularización — digitalización del SGC (registro posterior al hecho)";
const MOTIVO_NORMAL = "Gestión normal";

// Semáforo de plazo según la fecha programada de la disposición
function semaforoNC(r) {
  if (r.estado === "Cerrada") return { c: "⚪", t: "Cerrada" };
  if (r.cumplido === "Sí") return { c: "🟢", t: "Cumplida" };
  const f = r.fechaProgramada ? String(r.fechaProgramada).slice(0, 10) : "";
  if (!f) return { c: "🟡", t: "Sin fecha programada" };
  const hoy = hoyISO();
  if (f < hoy) return { c: "🔴", t: "Vencida" };
  const dias = Math.round((new Date(f) - new Date(hoy)) / 86400000);
  return dias <= 3 ? { c: "🟡", t: "Por vencer" } : { c: "🟢", t: "En término" };
}

function HistorialNC({ items }) {

            <tr key={h.id} className="border-t border-slate-100 align-top">
              <td className="px-2 py-1.5 whitespace-nowrap text-slate-600">{fmtDT(h.fecha)}</td>
              <td className="px-2 py-1.5 font-medium text-slate-700">{h.campo}</td>
              <td className="px-2 py-1.5 text-slate-500 max-w-[160px] truncate" title={h.valor_anterior || ""}>{h.valor_anterior || "—"}</td>
              <td className="px-2 py-1.5 text-slate-700 max-w-[160px] truncate" title={h.valor_nuevo || ""}>{h.valor_nuevo || "—"}</td>

              <td className="px-2 py-1.5 text-slate-500">{h.usuario || ""}</td>

          ))}

    </div>
  );

// Gestión del estado de una NC: acción inmediata, requiere acción, estado — con historial y trazabilidad.
function CumplimientoEditor({ registros, recargarRegistros }) {
  const [sel, setSel] = useState("");
  const [det, setDet] = useState(null);
  const [requiere, setRequiere] = useState("");
  const [cumplido, setCumplido] = useState("");
  const [fecha, setFecha] = useState("");
  const [estado, setEstado] = useState("Abierta");
  const [motivo, setMotivo] = useState(MOTIVO_NORMAL);
  const [msg, setMsg] = useState(null);
  const [guardando, setGuardando] = useState(false);
  const hoy = hoyISO();
  const lista = registros.filter((r) => r.tipo !== TIPO_OM && r.estado !== "Cerrada");

  async function elegir(num) {
    setSel(num); setDet(null); setMsg(null);
    if (!num) return;
    try {
      const d = await apiGet(`/nc/${num}`);
      setDet(d);
      setRequiere(d.requiere_accion || "");
      setCumplido(d.cumplido || "");
      setFecha(d.fecha_cumplimiento ? String(d.fecha_cumplimiento).slice(0, 10) : "");
      setEstado((d.analisis && d.analisis.estado) || "Abierta");
      setMotivo(MOTIVO_NORMAL);
    } catch (e) { setMsg({ e: true, t: "No se pudo cargar la NC: " + e.message }); }
  }
  // Si la fecha del hecho es anterior a hoy, el registro es posterior al hecho: se sugiere dejar constancia.
  useEffect(() => { if (cumplido === "Sí" && fecha && fecha < hoy) setMotivo(MOTIVO_REGULARIZACION); }, [cumplido, fecha]);

  const an = det && det.analisis;
  const checks = [
    { ok: !!requiere, t: "Definido si requiere acción correctiva" },
    { ok: cumplido === "Sí" && !!fecha, t: "Acción inmediata cumplida, con fecha real" },
    ...(requiere === "Sí" ? [
      { ok: !!(an && an.causa_raiz), t: "Causa raíz (5 porqués) — se carga más abajo en «Análisis»" },
      { ok: !!(an && an.fecha_verif_cumplimiento && an.evidencia_cumplimiento), t: "Verificación de cumplimiento (fecha y evidencia)" },
      { ok: !!(an && an.fecha_verif_eficacia && an.evidencia_eficacia), t: "Verificación de eficacia (fecha y evidencia)" },
    ] : []),
  ];
  const puedeCerrar = checks.every((c) => c.ok);

  async function guardar() {
    if (!sel) { setMsg({ e: true, t: "Elegí la NC." }); return; }
    setGuardando(true); setMsg(null);
    try {
      await apiPut(`/nc/${sel}/gestion`, {
        requiereAccion: requiere || undefined, cumplido: cumplido || undefined,
        fechaCumplimiento: cumplido === "Sí" ? fecha : null, estado, motivo: motivo === MOTIVO_NORMAL ? null : motivo,
      });
      const reg = registros.find((r) => String(r.numero) === String(sel)) || {};
      const d2 = await apiGet(`/nc/${sel}`);
      const b2 = mapAnalisisFromApi(d2.analisis);
      const datos = armarDatosWord({ ...reg, requiereAccion: requiere, cumplido, fechaCumplimiento: cumplido === "Sí" ? fecha : "" }, reg.numeroMostrar || sel, b2);
      const ok = await guardarSnapshotWord(sel, datos, estado === "Cerrada");
      setMsg({ e: !ok, t: ok ? "Guardado y Q.21 actualizado." + (estado === "Cerrada" ? " La NC quedó cerrada y su documento congelado." : "") : "Se guardó, pero no se pudo actualizar el Word del Q.21." });
      setDet(d2);
      await recargarRegistros();
    } catch (e) {
      setMsg({ e: true, t: e.message });
    } finally { setGuardando(false); }
  }

  const btn = (act, v, set, color = "bg-emerald-600 text-white border-emerald-600") => (
    <button key={v} type="button" onClick={() => set(v)} className={`px-3 py-1.5 rounded-md text-sm border ${act === v ? color : "bg-white text-slate-600 border-slate-300"}`}>{v}</button>
  );
  const sem = det ? semaforoNC({ estado, cumplido, fechaProgramada: det.fecha_programada }) : null;

  return (
    <div className="border border-emerald-200 bg-emerald-50/50 rounded-lg p-4 space-y-3">
      <div>
        <h3 className="text-sm font-semibold text-slate-800">Gestión del estado de la NC</h3>
        <p className="text-xs text-slate-500">Elegí la NC, cargá lo que realmente ocurrió y su fecha. Cada cambio queda en el historial con la fecha de registro automática.</p>
      </div>
      <select value={sel} onChange={(e) => elegir(e.target.value)} className="border border-slate-300 rounded-md px-3 py-2 text-sm bg-white w-full">
        <option value="">Elegí la NC a gestionar…</option>
        {lista.map((r) => {
          const s2 = semaforoNC(r);
          return <option key={r.numero} value={r.numero}>{s2.c} Nº {r.numeroMostrar} · {r.producto} {r.cliente ? "· " + r.cliente : ""} · {r.estado || "Abierta"}</option>;
        })}
      </select>

      {det && (
        <>
          <div className="text-xs text-slate-600 flex flex-wrap gap-x-4 gap-y-1">
            <span>{sem.c} {sem.t}</span>
            <span>Fecha programada de disposición: <b>{fmtD(det.fecha_programada) || "—"}</b></span>
            <span>Fecha de registro de la NC: <b>{fmtDT(det.creado_en)}</b></span>
          </div>
          <div className="grid sm:grid-cols-2 gap-3">
            <div>
              <p className="text-xs font-medium text-slate-600 mb-1">¿Requiere acción correctiva?</p>
              <div className="flex gap-2">{btn(requiere, "Sí", setRequiere, "bg-slate-800 text-white border-slate-800")}{btn(requiere, "No", setRequiere, "bg-slate-800 text-white border-slate-800")}</div>
            </div>
            <div>
              <p className="text-xs font-medium text-slate-600 mb-1">¿Acción inmediata cumplida?</p>
              <div className="flex gap-2 items-center">
                {btn(cumplido, "Sí", setCumplido)}{btn(cumplido, "No", setCumplido, "bg-slate-500 text-white border-slate-500")}
                {cumplido === "Sí" && <input type="date" max={hoy} value={fecha} onChange={(e) => setFecha(e.target.value)} className="border border-slate-300 rounded-md px-2 py-1.5 text-sm bg-white" />}
              </div>
              {cumplido === "Sí" && <p className="text-[11px] text-slate-400 mt-1">Fecha del hecho: la real, respaldada por evidencia. No puede ser futura.</p>}
            </div>
          </div>
          <div>
            <p className="text-xs font-medium text-slate-600 mb-1">Estado</p>
            <div className="flex flex-wrap gap-2">
              {ESTADOS.map((e) => {
                const bloq = e === "Cerrada" && !puedeCerrar;
                return (
                  <button key={e} type="button" disabled={bloq} onClick={() => setEstado(e)}
                    className={`px-3 py-1.5 rounded-md text-sm border ${estado === e ? "bg-slate-800 text-white border-slate-800" : bloq ? "bg-slate-50 text-slate-300 border-slate-200 cursor-not-allowed" : "bg-white text-slate-600 border-slate-300"}`}>{e}</button>
                );
              })}
            </div>
            <ul className="mt-2 text-[11px] space-y-0.5">
              {checks.map((c) => <li key={c.t} className={c.ok ? "text-emerald-700" : "text-slate-400"}>{c.ok ? "✔" : "○"} {c.t}</li>)}
            </ul>
          </div>
          <div>
            <p className="text-xs font-medium text-slate-600 mb-1">Motivo del cambio (queda en el historial)</p>
            <select value={motivo} onChange={(e) => setMotivo(e.target.value)} className="border border-slate-300 rounded-md px-3 py-1.5 text-sm bg-white">
              <option>{MOTIVO_NORMAL}</option>
              <option>{MOTIVO_REGULARIZACION}</option>
            </select>
            <p className="text-[11px] text-slate-400 mt-1">La fecha y hora de registro las pone el sistema y no se pueden editar.</p>
          </div>
          <button type="button" onClick={guardar} disabled={guardando} className="px-4 py-2 rounded-md text-sm bg-slate-800 text-white disabled:opacity-50">{guardando ? "Guardando…" : "Guardar gestión"}</button>
          <div>
            <p className="text-xs font-medium text-slate-600 mb-1">Historial de esta NC</p>
            <HistorialNC items={det.historial} />
          </div>
        </>
      )}
      {msg && <p className={`text-xs ${msg.e ? "text-red-600" : "text-emerald-700"}`}>{msg.t}</p>}
    </div>
  );
}


// Gestión del ciclo de una Oportunidad de mejora (Q.21.B): aprobación, plan, implementación y verificación de vigencia a los 6 meses.
function GestionOM({ registros, recargarRegistros }) {
  const [q, setQ] = useState("");
  const [sel, setSel] = useState("");
  const [det, setDet] = useState(null);
  const [f, setF] = useState({});
  const [motivo, setMotivo] = useState(MOTIVO_NORMAL);
  const [motivoDisc, setMotivoDisc] = useState("");
  const [msg, setMsg] = useState(null);
  const [guardando, setGuardando] = useState(false);
  const hoy = hoyISO();
  const oms = registros.filter((r) => r.tipo === TIPO_OM && (!q || `${r.numeroMostrar} ${r.producto} ${r.descripcion}`.toLowerCase().includes(q.toLowerCase()))).slice(0, 60);
  const d10 = (v) => (v ? String(v).slice(0, 10) : "");
  const set = (k, v) => setF((x) => ({ ...x, [k]: v }));

  async function elegir(num) {
    setSel(num); setDet(null); setMsg(null); setMotivoDisc("");
    if (!num) return;
    try {
      const d = await apiGet(`/nc/${num}`);
      const o = d.om || {};
      setDet(d);
      setF({
        aprobada: o.aprobada || "", origen: o.origen || "", proponente: o.proponente || "", responsable: o.responsable || "", fechaPrevista: d10(o.fecha_prevista),
        beneficio: o.beneficio_esperado || "", necesidad: o.necesidad || "", impacto: o.impacto || "", meta: o.meta || "", plan: o.plan || "",
        fImpl: d10(o.fecha_implementacion), fVerifImpl: d10(o.fecha_verif_implementacion), evImpl: o.evidencia_implementacion || "",
        vigencia: o.vigencia || "Sí", fVig: d10(o.fecha_vigencia), evVig: o.evidencia_vigencia || "",
      });
      setMotivo(MOTIVO_NORMAL);
    } catch (e) { setMsg({ e: true, t: "No se pudo cargar la OM: " + e.message }); }
  }
  useEffect(() => {
    const fechas = [f.fImpl, f.fVerifImpl, f.fVig].filter(Boolean);
    if (fechas.some((x) => x < hoy)) setMotivo(MOTIVO_REGULARIZACION);
  }, [f.fImpl, f.fVerifImpl, f.fVig]);

  const cerrada = det && det.om && det.om.cerrada_en;
  const minVig = f.fImpl ? (() => { const d = new Date(f.fImpl + "T00:00:00Z"); d.setUTCMonth(d.getUTCMonth() + 6); return d.toISOString().slice(0, 10); })() : "";
  const checks = [
    { ok: f.aprobada === "Sí", t: "Mejora aprobada" },
    { ok: !!(f.fImpl && f.evImpl), t: "Implementada: fecha real y evidencia" },
    { ok: !!(f.fVig && f.evVig && minVig && f.fVig >= minVig), t: `Verificación de vigencia a los 6 meses o más${minVig ? " (desde el " + fmtD(minVig) + ")" : ""}, con evidencia` },
    { ok: f.vigencia === "Sí", t: "La mejora sigue implementada (vigencia = Sí)" },
  ];
  const puedeCerrar = checks.every((c) => c.ok);
  const aviso = !cerrada && f.fImpl && minVig && hoy >= minVig ? "🟠 Ya pasaron 6 meses de la implementación: toca verificar la vigencia." : "";

  async function guardar(accion) {
    if (!sel) { setMsg({ e: true, t: "Elegí la OM." }); return; }
    setGuardando(true); setMsg(null);
    try {
      const body = {
        aprobada: f.aprobada, origen: f.origen, proponente: f.proponente, responsable: f.responsable, fechaPrevista: f.fechaPrevista, beneficioEsperado: f.beneficio,
        necesidad: f.necesidad, impacto: f.impacto, meta: f.meta, plan: f.plan, fechaImplementacion: f.fImpl, fechaVerifImplementacion: f.fVerifImpl,
        evidenciaImplementacion: f.evImpl, vigencia: f.vigencia, fechaVigencia: f.fVig, evidenciaVigencia: f.evVig,
        motivo: motivo === MOTIVO_NORMAL ? null : motivo,
      };
      if (accion === "cerrar") body.cerrar = true;
      if (accion === "discontinuar") { body.discontinuar = true; body.motivoCierre = motivoDisc; }
      if (accion === "reabrir") body.reabrir = true;
      await apiPut(`/om/${sel}/gestion`, body);
      const reg = registros.find((r) => String(r.numero) === String(sel)) || {};
      const d2 = await apiGet(`/nc/${sel}`);
      const congelar = accion === "cerrar" || accion === "discontinuar";
      const ok = await guardarSnapshotWord(sel, armarDatosWord(reg, reg.numeroMostrar || sel, null, d2.om), congelar);
      setMsg({ e: !ok, t: (ok ? "Guardado y Q.21.B actualizado." : "Se guardó, pero no se pudo actualizar el Word del Q.21.B.") + (congelar ? " La OM quedó cerrada y su documento congelado." : "") });
      setDet(d2);
      await recargarRegistros();
    } catch (e) { setMsg({ e: true, t: e.message }); } finally { setGuardando(false); }
  }

  const inp = "w-full border border-slate-300 rounded-md px-2 py-1.5 text-sm bg-white";
  const lbl = "block text-xs font-medium text-slate-600 mb-1";
  const sn = (k, v, c = "bg-slate-800 text-white border-slate-800") => (
    <button key={v} type="button" onClick={() => set(k, v)} className={`px-3 py-1.5 rounded-md text-sm border ${f[k] === v ? c : "bg-white text-slate-600 border-slate-300"}`}>{v}</button>
  );
  return (
    <div className="border border-sky-200 bg-sky-50/50 rounded-lg p-4 space-y-3">
      <div>
        <h3 className="text-sm font-semibold text-slate-800">Gestión de oportunidades de mejora (Q.21.B)</h3>
        <p className="text-xs text-slate-500">Aprobación, origen y justificación, implementación y verificación de vigencia a los 6 meses. Cada cambio queda en el historial.</p>
      </div>
      <div className="flex gap-2">
        <input type="text" value={q} onChange={(e) => setQ(e.target.value)} placeholder="Buscar por Nº o texto…" className={`${inp} max-w-[200px]`} />
        <select value={sel} onChange={(e) => elegir(e.target.value)} className={inp}>
          <option value="">Elegí la OM a gestionar…</option>

      {det && (
        <>
          <div className="text-xs text-slate-600 flex flex-wrap gap-x-4">
            <span>{cerrada ? "⚪ Cerrada el " + fmtD(det.om.cerrada_en) + " — " + (det.om.motivo_cierre || "") : "🟢 Abierta"}</span>
            <span>Registrada: <b>{fmtDT(det.creado_en)}</b></span>
          </div>
          {aviso && <p className="text-xs text-amber-700">{aviso}</p>}
          <div className="grid sm:grid-cols-3 gap-3">
            <div><label className={lbl}>Origen</label>
              <select value={f.origen} onChange={(e) => set("origen", e.target.value)} className={inp}>
                <option value="">Seleccionar</option>{["Hallazgo de auditoría", "Problema de producción", "Análisis del FODA", "Idea/propuesta"].map((x) => <option key={x}>{x}</option>)}
              </select></div>
            <div><label className={lbl}>Proponente</label><input value={f.proponente} onChange={(e) => set("proponente", e.target.value)} className={inp} /></div>
            <div><label className={lbl}>Responsable de implementación</label><input value={f.responsable} onChange={(e) => set("responsable", e.target.value)} className={inp} /></div>
          </div>
          <div><label className={lbl}>¿Se aprueba implementar la mejora?</label><div className="flex gap-2">{sn("aprobada", "Sí")}{sn("aprobada", "No", "bg-slate-500 text-white border-slate-500")}</div></div>
          <div className="grid sm:grid-cols-3 gap-3">
            <div className="sm:col-span-3"><label className={lbl}>Necesidad o problema que atiende (por qué surge)</label><textarea rows={2} value={f.necesidad} onChange={(e) => set("necesidad", e.target.value)} className={inp} /></div>
            <div><label className={lbl}>Impacto esperado</label><textarea rows={2} value={f.impacto} onChange={(e) => set("impacto", e.target.value)} className={inp} /></div>
            <div><label className={lbl}>Indicador / meta</label><textarea rows={2} value={f.meta} onChange={(e) => set("meta", e.target.value)} className={inp} /></div>
            <div><label className={lbl}>Beneficio esperado</label><textarea rows={2} value={f.beneficio} onChange={(e) => set("beneficio", e.target.value)} className={inp} /></div>
          </div>
          <div className="grid sm:grid-cols-3 gap-3">
            <div className="sm:col-span-2"><label className={lbl}>Plan de implementación</label><textarea rows={2} value={f.plan} onChange={(e) => set("plan", e.target.value)} className={inp} /></div>
            <div><label className={lbl}>Fecha prevista de implementación</label><input type="date" value={f.fechaPrevista} onChange={(e) => set("fechaPrevista", e.target.value)} className={inp} /></div>
          </div>
          <div className="grid sm:grid-cols-3 gap-3 border-t border-sky-100 pt-3">
            <div><label className={lbl}>Fecha de implementación (real)</label><input type="date" max={hoy} value={f.fImpl} onChange={(e) => set("fImpl", e.target.value)} className={inp} /></div>
            <div><label className={lbl}>Fecha de verificación de la implementación</label><input type="date" max={hoy} value={f.fVerifImpl} onChange={(e) => set("fVerifImpl", e.target.value)} className={inp} /></div>
            <div className="sm:col-span-3"><label className={lbl}>Evidencia de la implementación</label><textarea rows={2} value={f.evImpl} onChange={(e) => set("evImpl", e.target.value)} className={inp} /></div>
          </div>
          <div className="grid sm:grid-cols-3 gap-3 border-t border-sky-100 pt-3">
            <div><label className={lbl}>Verificación de vigencia a los 6 meses (fecha)</label><input type="date" max={hoy} value={f.fVig} onChange={(e) => set("fVig", e.target.value)} className={inp} /></div>
            <div><label className={lbl}>¿Sigue implementada?</label><div className="flex gap-2">{sn("vigencia", "Sí", "bg-emerald-600 text-white border-emerald-600")}{sn("vigencia", "No", "bg-rose-600 text-white border-rose-600")}</div></div>
            <div className="sm:col-span-3"><label className={lbl}>Evidencia de vigencia</label><textarea rows={2} value={f.evVig} onChange={(e) => set("evVig", e.target.value)} className={inp} /></div>
          </div>
          <ul className="text-[11px] space-y-0.5">{checks.map((c) => <li key={c.t} className={c.ok ? "text-emerald-700" : "text-slate-400"}>{c.ok ? "✔" : "○"} {c.t}</li>)}</ul>
          <div>
            <label className={lbl}>Motivo del cambio (queda en el historial)</label>
            <select value={motivo} onChange={(e) => setMotivo(e.target.value)} className="border border-slate-300 rounded-md px-3 py-1.5 text-sm bg-white">
              <option>{MOTIVO_NORMAL}</option><option>{MOTIVO_REGULARIZACION}</option>
            </select>
          </div>
          <div className="flex flex-wrap gap-2">
            <button type="button" onClick={() => guardar("guardar")} disabled={guardando || cerrada} className="px-4 py-2 rounded-md text-sm bg-slate-800 text-white disabled:opacity-50">{guardando ? "Guardando…" : "Guardar"}</button>
            <button type="button" onClick={() => guardar("cerrar")} disabled={guardando || cerrada || !puedeCerrar} className="px-4 py-2 rounded-md text-sm bg-emerald-600 text-white disabled:opacity-40">Cerrar OM (vigente a 6 meses)</button>
          </div>
          {!cerrada && (
            <div className="flex flex-wrap gap-2 items-center">
              <input value={motivoDisc} onChange={(e) => setMotivoDisc(e.target.value)} placeholder="Motivo si se discontinúa" className={`${inp} max-w-xs`} />
              <button type="button" onClick={() => guardar("discontinuar")} disabled={guardando || !motivoDisc.trim()} className="px-3 py-1.5 rounded-md text-sm border border-rose-300 text-rose-700 disabled:opacity-40">Discontinuar</button>
            </div>
          )}
          <div><p className="text-xs font-medium text-slate-600 mb-1">Historial de esta OM</p><HistorialNC items={det.historial} /></div>
        </>
      )}
      {msg && <p className={`text-xs ${msg.e ? "text-red-600" : "text-emerald-700"}`}>{msg.t}</p>}
    </div>
  );
}

function Bloque2({ registros, recargarRegistros }) {
  const [b2, setB2] = useState(emptyBloque2);
  const [notificaciones, setNotificaciones] = useState([{ nombre: "", fecha: "" }]);
  const [cargandoNC, setCargandoNC] = useState(false);

  function update(field, value) {
    setB2((f) => ({ ...f, [field]: value }));
  }

  function updatePorque(index, value) {
    setB2((f) => {
      const porques = [...f.porques];
      porques[index] = value;
      return { ...f, porques };
    });
  }

  function addNotificacion() {
    setNotificaciones((n) => [...n, { nombre: "", fecha: "" }]);
  }

  function updateNotificacion(index, field, value) {
    setNotificaciones((n) => {
      const copia = [...n];
      copia[index] = { ...copia[index], [field]: value };
      return copia;
    });
  }

  const pendientes = registros.filter((r) => r.requiereAccion === "Sí" && r.estado !== "Cerrada");

  async function handleSeleccionarNC(numero) {
    update("numeroNC", numero);
    if (!numero) return;
    setCargandoNC(true);
    setErrorB2("");
    try {
      const detalle = await apiGet(`/nc/${numero}`);
      const analisis = mapAnalisisFromApi(detalle.analisis);
      setB2(analisis || { ...emptyBloque2, numeroNC: String(numero) });
      setNotificaciones(
        detalle.notificaciones && detalle.notificaciones.length > 0
          ? detalle.notificaciones.map((n) => ({ nombre: n.nombre, fecha: n.fecha || "" }))
          : [{ nombre: "", fecha: "" }]
      );
    } catch (e) {
      setErrorB2("No se pudo cargar la NC: " + e.message);
    } finally {
      setCargandoNC(false);
    }
  }

  const [generandoB2, setGenerandoB2] = useState(false);
  const [guardandoB2, setGuardandoB2] = useState(false);
  const [guardadoOkB2, setGuardadoOkB2] = useState(false);
  const [errorB2, setErrorB2] = useState("");

  async function handleGuardarAnalisis() {
    if (!b2.numeroNC) {
      setErrorB2("Seleccioná primero la NC que estás gestionando.");
      return;
    }
    setErrorB2("");
    setGuardandoB2(true);
    setGuardadoOkB2(false);
    try {
      await apiPut(`/nc/${b2.numeroNC}/analisis`, b2);
      if (!b2.noRequiereNotificacion) {
        for (const n of notificaciones) {
          if (n.nombre && n.nombre.trim()) {
            await apiPost(`/nc/${b2.numeroNC}/notificaciones`, n);
          }
        }
      }
      // Regenera (pisa) el snapshot Q.21 con los datos actuales del Bloque 2.
      // Si el estado quedó "Cerrada", se congela: no se vuelve a sobrescribir después.
      const registroBase = registros.find((r) => String(r.numero) === String(b2.numeroNC)) || {};
      const numeroReal = registroBase.numeroMostrar || b2.numeroNC;
      guardarSnapshotWord(b2.numeroNC, armarDatosWord(registroBase, numeroReal, b2), b2.estado === "Cerrada");
      setGuardadoOkB2(true);
      await recargarRegistros();
    } catch (e) {
      setErrorB2("No se pudo guardar el análisis: " + e.message);
    } finally {
      setGuardandoB2(false);
    }
  }

  async function handleDescargarWordB2() {
    if (!b2.numeroNC) {
      setErrorB2("Seleccioná primero la NC que estás gestionando.");
      return;
    }
    setErrorB2("");
    setGenerandoB2(true);
    try {
      const registroBase = registros.find((r) => String(r.numero) === String(b2.numeroNC)) || {};
      // Para imprimir/nombrar el Word usamos el número REAL (numeroMostrar), no el
      // "numero" interno que usan las NC migradas del histórico para no chocar entre sí.
      const numeroReal = registroBase.numeroMostrar || b2.numeroNC;
      const datos = armarDatosWord(registroBase, numeroReal, b2);
      await generarWordNC(datos, `Q21_NC_${numeroReal}.docx`);
    } catch (e) {
      setErrorB2("No se pudo generar el Word: " + e.message);
    } finally {
      setGenerandoB2(false);
    }
  }

  return (
    <div className="bg-white rounded-lg border border-slate-200 p-5 space-y-6">
      <CumplimientoEditor registros={registros} recargarRegistros={recargarRegistros} />
      <GestionOM registros={registros} recargarRegistros={recargarRegistros} />
      <div className="border-b border-slate-100 pb-3">
        <label className="block text-sm font-medium text-slate-700 mb-1">Nº de NC a gestionar</label>
        <select
          value={b2.numeroNC}
          onChange={(e) => handleSeleccionarNC(e.target.value)}
          className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm"
        >
          <option value="">Seleccionar de las pendientes del Bloque 1</option>
          {pendientes.map((r) => (
            <option key={r.numero} value={r.numero}>
              {r.tipo === TIPO_OM ? "OM" : r.tipo === TIPO_HA && r.numero >= 300000 ? "Hallazgo" : "NC"} Nº {r.numeroMostrar} — {r.producto}
            </option>
          ))}
        </select>
        {cargandoNC && <p className="text-xs text-slate-400 mt-2">Cargando datos de la NC...</p>}
        {pendientes.length === 0 && (
          <p className="text-xs text-slate-400 mt-2">
            Todavía no hay NC marcadas como "Requiere acción correctiva" en el Bloque 1.
          </p>
        )}
      </div>

      {(() => {
        const reg = registros.find((r) => String(r.numero) === String(b2.numeroNC));
        return reg ? <ClasificacionEditor registro={reg} recargarRegistros={recargarRegistros} /> : null;
      })()}

      <div>
        <h3 className="text-sm font-semibold text-slate-800 mb-2">Análisis de causa — 5 porqués</h3>
        <div className="space-y-2">
          {b2.porques.map((p, i) => (
            <input
              key={i}
              type="text"
              value={p}
              onChange={(e) => updatePorque(i, e.target.value)}
              placeholder={`Porqué ${i + 1}${i === 4 ? " (causa raíz)" : ""}`}
              className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm"
            />
          ))}
        </div>
        <textarea
          value={b2.causaRaiz}
          onChange={(e) => update("causaRaiz", e.target.value)}
          placeholder="Resumen de causa raíz"
          rows={2}
          className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm mt-2"
        />
      </div>

      <div>
        <h3 className="text-sm font-semibold text-slate-800 mb-2">Documentación</h3>
        <div className="flex gap-2 mb-2">
          {["Sí", "No"].map((v) => (
            <button
              key={v}
              type="button"
              onClick={() => update("modificarDocumento", v)}
              className={`px-3 py-1.5 rounded-md text-sm border ${
                b2.modificarDocumento === v
                  ? "bg-slate-800 text-white border-slate-800"
                  : "bg-white text-slate-600 border-slate-300"
              }`}
            >
              {v === "Sí" ? "Requiere modificar documento" : "No requiere"}
            </button>
          ))}
        </div>
        {b2.modificarDocumento === "Sí" && (
          <input
            type="text"
            value={b2.documentoDetalle}
            onChange={(e) => update("documentoDetalle", e.target.value)}
            placeholder="Qué manual, instructivo o registro"
            className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm"
          />
        )}
      </div>

      <div>
        <h3 className="text-sm font-semibold text-slate-800 mb-2">Acción correctiva</h3>
        <textarea
          value={b2.accionDescripcion}
          onChange={(e) => update("accionDescripcion", e.target.value)}
          placeholder="Descripción de la acción definida"
          rows={2}
          className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm mb-2"
        />
        <div className="grid grid-cols-2 gap-4">
          <div>
            <label className="block text-xs text-slate-500 mb-1">Responsable del sector</label>
            <select
              value={b2.responsable}
              onChange={(e) => update("responsable", e.target.value)}
              className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm"
            >
              <option value="">Seleccionar</option>
              {RESPONSABLES.map((r) => (
                <option key={r} value={r}>
                  {r}
                </option>
              ))}
            </select>
          </div>
          <div>
            <label className="block text-xs text-slate-500 mb-1">Fecha programada de implementación</label>
            <input
              type="date"
              value={b2.fechaProgramadaAccion}
              onChange={(e) => update("fechaProgramadaAccion", e.target.value)}
              className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm"
            />
          </div>
        </div>
      </div>

      <div>
        <h3 className="text-sm font-semibold text-slate-800 mb-2">Verificación</h3>
        <div className="grid grid-cols-2 gap-4">
          <div>
            <label className="block text-xs text-slate-500 mb-1">Fecha verificación de cumplimiento</label>
            <input
              type="date"
              value={b2.fechaVerifCumplimiento}
              onChange={(e) => update("fechaVerifCumplimiento", e.target.value)}
              className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm"
            />
          </div>
          <div>
            <label className="block text-xs text-slate-500 mb-1">¿Se implementó la acción?</label>
            <div className="flex gap-2">
              {["Sí", "No"].map((v) => (
                <button
                  key={v}
                  type="button"
                  onClick={() => update("cumplioAccion", v)}
                  className={`flex-1 px-3 py-2 rounded-md text-sm border ${
                    b2.cumplioAccion === v
                      ? "bg-slate-800 text-white border-slate-800"
                      : "bg-white text-slate-600 border-slate-300"
                  }`}
                >
                  {v}
                </button>
              ))}
            </div>
          </div>
        </div>
        <div className="mt-3">
          <label className="block text-xs text-slate-500 mb-1">Evidencia de cumplimiento</label>
          <textarea
            value={b2.evidenciaCumplimiento}
            onChange={(e) => update("evidenciaCumplimiento", e.target.value)}
            placeholder="Ensayo, validación o monitoreo que confirma que la acción se implementó"
            rows={2}
            className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm"
          />
        </div>
        <div className="mt-3">
          <label className="block text-xs text-slate-500 mb-1">
            Fecha verificación de eficacia <span className="text-slate-400">(la acción no volvió a repetirse)</span>
          </label>
          <input
            type="date"
            value={b2.fechaVerifEficacia}
            onChange={(e) => update("fechaVerifEficacia", e.target.value)}
            className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm"
          />
        </div>
        <div className="mt-3">
          <label className="block text-xs text-slate-500 mb-1">Evidencia de eficacia</label>
          <textarea
            value={b2.evidenciaEficacia}
            onChange={(e) => update("evidenciaEficacia", e.target.value)}
            placeholder="Qué comprueba que no volvió a repetirse: nuevo lote sin defectos, envíos sin recurrencia, etc."
            rows={2}
            className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm"
          />
        </div>
      </div>

      <div>
        <h3 className="text-sm font-semibold text-slate-800 mb-2">Notificación de la NC</h3>
        <label className="flex items-center gap-2 text-sm text-slate-600 mb-3">
          <input
            type="checkbox"
            checked={b2.noRequiereNotificacion}
            onChange={(e) => update("noRequiereNotificacion", e.target.checked)}
          />
          No requiere notificación (ej. sin responsable identificado, causa de proceso/material)
        </label>
        {!b2.noRequiereNotificacion && (
          <>
            <div className="space-y-2">
              {notificaciones.map((n, i) => (
                <div key={i} className="grid grid-cols-2 gap-2">
                  <input
                    type="text"
                    value={n.nombre}
                    onChange={(e) => updateNotificacion(i, "nombre", e.target.value)}
                    placeholder="Nombre"
                    className="border border-slate-300 rounded-md px-3 py-2 text-sm"
                  />
                  <input
                    type="date"
                    value={n.fecha}
                    onChange={(e) => updateNotificacion(i, "fecha", e.target.value)}
                    className="border border-slate-300 rounded-md px-3 py-2 text-sm"
                  />
                </div>
              ))}
            </div>
            <button
              type="button"
              onClick={addNotificacion}
              className="mt-2 text-xs text-slate-600 border border-slate-300 rounded-md px-3 py-1.5 hover:bg-slate-50"
            >
              + Agregar notificación
            </button>
          </>
        )}
      </div>

      <div className="border-t border-slate-100 pt-4">
        <label className="block text-sm font-medium text-slate-700 mb-1">Costo asociado (opcional)</label>
        <input
          type="number"
          step="0.01"
          value={b2.costoAsociado}
          onChange={(e) => update("costoAsociado", e.target.value)}
          placeholder="Ej: 45000"
          className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm"
        />
        <p className="text-xs text-slate-400 mt-1">
          Costo estimado de reproceso, scrap, devolución, etc. asociado a esta NC.
        </p>
      </div>

      <div className="border-t border-slate-100 pt-4">
        <label className="block text-sm font-medium text-slate-700 mb-2">Estado de la NC</label>
        <div className="flex flex-wrap gap-2">
          {ESTADOS.map((e) => {
            const bloqueado =
              e === "Cerrada" && (!b2.fechaVerifCumplimiento || !b2.fechaVerifEficacia);
            return (
              <button
                key={e}
                type="button"
                disabled={bloqueado}
                onClick={() => update("estado", e)}
                className={`px-3 py-1.5 rounded-md text-sm border ${
                  b2.estado === e
                    ? "bg-slate-800 text-white border-slate-800"
                    : bloqueado
                    ? "bg-slate-50 text-slate-300 border-slate-200 cursor-not-allowed"
                    : "bg-white text-slate-600 border-slate-300"
                }`}
              >
                {e}
              </button>
            );
          })}
        </div>
        <p className="text-xs text-slate-400 mt-2">
          No se puede cerrar sin cargar la fecha de verificación de cumplimiento y la de eficacia — así el estado
          "Cerrada" siempre implica que ambas verificaciones quedaron registradas.
        </p>
      </div>

      {errorB2 && <p className="text-sm text-red-600">{errorB2}</p>}
      {guardadoOkB2 && <p className="text-sm text-emerald-600">Análisis guardado correctamente en la base.</p>}

      <button
        type="button"
        onClick={handleGuardarAnalisis}
        disabled={guardandoB2}
        className="w-full bg-slate-800 text-white rounded-md py-2.5 text-sm font-medium hover:bg-slate-700 disabled:opacity-50"
      >
        {guardandoB2 ? "Guardando..." : "Guardar análisis"}
      </button>

      <button
        type="button"
        onClick={handleDescargarWordB2}
        disabled={generandoB2}
        className="w-full border border-slate-300 text-slate-700 rounded-md py-2.5 text-sm font-medium hover:bg-slate-50 disabled:opacity-50"
      >
        {generandoB2 ? "Generando Word..." : "Descargar Word (Q.21 completo)"}
      </button>
    </div>
  );
}

function NCApp() {
  const [tab, setTab] = useState("bloque2");
  const [registros, setRegistros] = useState([]);
  const [cargandoLista, setCargandoLista] = useState(true);
  const [errorLista, setErrorLista] = useState("");

  async function recargarRegistros() {
    try {
      const data = await apiGet("/nc");
      setRegistros(data.map(mapNCFromApi));
      setErrorLista("");
    } catch (e) {
      setErrorLista("No se pudo conectar con la base de datos: " + e.message);
    } finally {
      setCargandoLista(false);
    }
  }

  useEffect(() => {
    recargarRegistros();
  }, []);

  return (
    <div className="w-full max-w-3xl mx-auto p-6 bg-slate-50 min-h-screen">
      <Header />

      <div className="mb-6">
        <div className="flex items-center justify-between">
          <div>
            <p className="text-xs font-medium text-slate-500 tracking-wide uppercase">Silver Industrial · Gestión de calidad</p>
            <h1 className="text-xl font-semibold text-slate-800 mt-1">Registro de No Conformidad</h1>
          </div>
          <div className="text-right text-xs text-slate-500">
            <p>Cód: Q.21 · Rev 4</p>
          </div>
        </div>
      </div>

      {errorLista && (
        <div className="bg-red-50 border border-red-200 text-red-700 text-sm rounded-md p-3 mb-4">{errorLista}</div>
      )}

      <div className="flex gap-2 mb-5">
        <button
          type="button"
          onClick={() => setTab("bloque1")}
          className={`px-4 py-2 rounded-md text-sm font-medium border ${
            tab === "bloque1" ? "bg-slate-800 text-white border-slate-800" : "bg-white text-slate-600 border-slate-300"
          }`}
        >
          Bloque 1 · Captura
        </button>
        <button
          type="button"
          onClick={() => setTab("bloque2")}
          className={`px-4 py-2 rounded-md text-sm font-medium border ${
            tab === "bloque2" ? "bg-slate-800 text-white border-slate-800" : "bg-white text-slate-600 border-slate-300"
          }`}
        >
          Bloque 2 · Gestión de calidad
        </button>
      </div>

      {cargandoLista ? (
        <p className="text-sm text-slate-400">Cargando datos...</p>
      ) : tab === "bloque1" ? (
        <Bloque1 registros={registros} recargarRegistros={recargarRegistros} />
      ) : (
        <Bloque2 registros={registros} recargarRegistros={recargarRegistros} />
      )}

      <p className="text-xs text-slate-400 mt-6">
        Conectado a la base de datos real — los registros ya no se pierden al recargar. La exportación al Word
        se genera desde estos mismos campos, tomando como plantilla el .docx oficial.
      </p>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<NCApp />);
</script>
</body>
</html>
