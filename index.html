function Header() {
  return (
    <div className="flex items-center justify-between mb-6 pb-4 border-b border-slate-200">
      <img src={LOGO_SILVER} alt="Silver Industrial" className="h-10" />
      <img src={BADGE_ISO} alt="Certified ISO 9001:2015 Bureau Veritas" className="h-10" />
    </div>
  );
}

function Bloque1({ registros, setRegistros }) {
  const [form, setForm] = useState(emptyForm);
  const [error, setError] = useState("");
  const nextNumero = 924 + registros.length + 1;

  function update(field, value) {
    setForm((f) => ({ ...f, [field]: value }));
  }

  function validar() {
    const requeridos = ["producto", "descripcion", "operario", "maquina", "oti", "disposicion"];
    for (const campo of requeridos) {
      if (!form[campo]) return false;
    }
    return true;
  }

  function handleSubmit() {
    if (!validar()) {
      setError("Completá producto, descripción, operario, máquina, OTI y disposición antes de guardar.");
      return;
    }
    setError("");
    const nuevo = { ...form, numero: nextNumero, id: Date.now() };
    setRegistros((r) => [nuevo, ...r]);
    setForm(emptyForm);
  }

  const [generando, setGenerando] = useState(false);

  async function handleDescargarWord() {
    if (!validar()) {
      setError("Completá producto, descripción, operario, máquina, OTI y disposición antes de descargar el Word.");
      return;
    }
    setError("");
    setGenerando(true);
    try {
      const datos = armarDatosWord(form, nextNumero, null);
      await generarWordNC(datos, `Q21_NC_${nextNumero}.docx`);
    } catch (e) {
      setError("No se pudo generar el Word: " + e.message);
    } finally {
      setGenerando(false);
    }
  }

  return (
    <div>
      <div className="bg-white rounded-lg border border-slate-200 p-5 space-y-5">
        <div className="flex items-center justify-between border-b border-slate-100 pb-3">
          <span className="text-sm font-medium text-slate-700">Nº de NC</span>
          <span className="text-sm font-semibold text-slate-800">{nextNumero}</span>
        </div>

        <div>
          <label className="block text-sm font-medium text-slate-700 mb-2">Tipo de informe</label>
          <div className="flex flex-wrap gap-2">
            {TIPOS_INFORME.map((t) => (
              <button
                key={t}
                type="button"
                onClick={() => update("tipo", t)}
                className={`px-3 py-1.5 rounded-md text-sm border ${
                  form.tipo === t
                    ? "bg-slate-800 text-white border-slate-800"
                    : "bg-white text-slate-600 border-slate-300 hover:border-slate-400"
                }`}
              >
                {t}
              </button>
            ))}
          </div>
        </div>

        <div>
          <label className="block text-sm font-medium text-slate-700 mb-2">Categoría</label>
          <div className="flex flex-wrap gap-2">
            {CATEGORIAS.map((c) => (
              <button
                key={c}
                type="button"
                onClick={() => update("categoria", c)}
                className={`px-3 py-1.5 rounded-md text-sm border ${
                  form.categoria === c
                    ? "bg-slate-800 text-white border-slate-800"
                    : "bg-white text-slate-600 border-slate-300 hover:border-slate-400"
                }`}
              >
                {c}
              </button>
            ))}
          </div>
        </div>

        <div>
          <label className="block text-sm font-medium text-slate-700 mb-1">Cliente</label>
          <input
            type="text"
            value={form.cliente}
            onChange={(e) => update("cliente", e.target.value)}
            placeholder="Ej: Autopiezas del Sur SA"
            className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm"
          />
        </div>

        <div className="grid grid-cols-2 gap-4">
          <div>
            <label className="block text-sm font-medium text-slate-700 mb-1">Nombre del producto</label>
            <input
              type="text"
              value={form.producto}
              onChange={(e) => update("producto", e.target.value)}
              placeholder="Ej: Lente 2028 led"
              className="w-full border border-slate-300 rounded-md px-3 py-2 text-sm"
            />
          </div>
          <div>
            <label className="block text-sm font-medium text-slate-700 mb-1">OTI</label>
            <input
              type="text"
              value={form.oti}

function base64ToUint8Array(base64) {
  const binary = atob(base64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return bytes;
}

async function generarWordNC(data, nombreArchivo) {
  const [{ default: PizZip }, { default: Docxtemplater }] = await Promise.all([
    import("https://esm.sh/pizzip@3.1.6"),
    import("https://esm.sh/docxtemplater@3.69.3"),
  ]);
  const bytes = base64ToUint8Array(Q21_TEMPLATE_B64);
  const zip = new PizZip(bytes);
  const doc = new Docxtemplater(zip, { paragraphLoop: true, linebreaks: true });
  doc.render(data);
  const out = doc.getZip().generate({
    type: "blob",
    mimeType: "application/vnd.openxmlformats-officedocument.wordprocessingml.document",
  });
  const url = URL.createObjectURL(out);
  const a = document.createElement("a");
  a.href = url;
  a.download = nombreArchivo;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function FotoAdjuntos() {
  const [fotos, setFotos] = useState([]);

  function handleFiles(e) {
    const archivos = Array.from(e.target.files || []);
    const nuevas = archivos.map((f) => ({
      id: `${f.name}-${Date.now()}-${Math.random()}`,
      url: URL.createObjectURL(f),
      nombre: f.name,
    }));
    setFotos((prev) => [...prev, ...nuevas]);
    e.target.value = "";
  }

  function quitarFoto(id) {
    setFotos((prev) => prev.filter((f) => f.id !== id));
  }

  return (
    <div>
      <div className="flex gap-2 mb-2">
        <label className="flex-1 text-center text-xs text-slate-600 border border-slate-300 rounded-md px-3 py-2 cursor-pointer hover:bg-slate-50">
          Sacar foto
          <input type="file" accept="image/*" capture="environment" onChange={handleFiles} className="hidden" />
        </label>
        <label className="flex-1 text-center text-xs text-slate-600 border border-slate-300 rounded-md px-3 py-2 cursor-pointer hover:bg-slate-50">
          Subir desde archivo
          <input type="file" accept="image/*" multiple onChange={handleFiles} className="hidden" />
        </label>
      </div>
      {fotos.length > 0 && (
        <div className="grid grid-cols-4 gap-2">
          {fotos.map((f) => (
            <div key={f.id} className="relative">
              <img src={f.url} alt={f.nombre} className="w-full h-16 object-cover rounded-md border border-slate-200" />
              <button
                type="button"
                onClick={() => quitarFoto(f.id)}
                className="absolute -top-1.5 -right-1.5 bg-slate-800 text-white rounded-full w-4 h-4 text-xs leading-none flex items-center justify-center"
              >
                ×
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function Bloque2({ registros }) {
  const [b2, setB2] = useState(emptyBloque2);
  const [notificaciones, setNotificaciones] = useState([{ nombre: "", fecha: "" }]);

  function update(field, value) {
    setB2((f) => ({ ...f, [field]: value }));
  }

  function updatePorque(index, value) {
    setB2((f) => {
      const porques = [...f.porques];
      porques[index] = value;
      return { ...f, porques };
    });
  }

  function addNotificacion() {
    setNotificaciones((n) => [...n, { nombre: "", fecha: "" }]);
  }

  function updateNotificacion(index, field, value) {
    setNotificaciones((n) => {
      const copia = [...n];
      copia[index] = { ...copia[index], [field]: value };
      return copia;
    });
  }

  const pendientes = registros.filter((r) => r.requiereAccion === "Sí");

  const [generandoB2, setGenerandoB2] = useState(false);
  const [errorB2, setErrorB2] = useState("");

  async function handleDescargarWordB2() {
    if (!b2.numeroNC) {
      setErrorB2("Seleccioná primero la NC que estás gestionando.");
      return;

    setErrorB2("");
    setGenerandoB2(true);
    try {
      const registroBase = registros.find((r) => String(r.numero) === String(b2.numeroNC)) || {};
      const datos = armarDatosWord(registroBase, b2.numeroNC, b2);
      await generarWordNC(datos, `Q21_NC_${b2.numeroNC}.docx`);

      setErrorB2("No se pudo generar el Word: " + e.message);
    } finally {
      setGenerandoB2(false);

        </div>
        <p className="text-xs text-slate-400 mt-2">
          No se puede cerrar sin cargar la fecha de verificación de cumplimiento y la de eficacia — así el estado
          "Cerrada" siempre implica que ambas verificaciones quedaron registradas.
        </p>
      </div>

      {errorB2 && <p className="text-sm text-red-600">{errorB2}</p>}

      <button
        type="button"
        onClick={handleDescargarWordB2}
        disabled={generandoB2}
        className="w-full bg-slate-800 text-white rounded-md py-2.5 text-sm font-medium hover:bg-slate-700 disabled:opacity-50"
      >
        {generandoB2 ? "Generando Word..." : "Descargar Word (Q.21 completo)"}
      </button>
    </div>
  );
}

function NCApp() {
  const [tab, setTab] = useState("bloque2");
  const [registros, setRegistros] = useState([]);

  return (
    <div className="w-full max-w-3xl mx-auto p-6 bg-slate-50 min-h-screen">
      <Header />

      <div className="mb-6">
        <div className="flex items-center justify-between">
          <div>
            <p className="text-xs font-medium text-slate-500 tracking-wide uppercase">Silver Industrial · Gestión de calidad</p>
            <h1 className="text-xl font-semibold text-slate-800 mt-1">Registro de No Conformidad</h1>
          </div>
          <div className="text-right text-xs text-slate-500">
            <p>Cód: Q.21 · Rev 4</p>
          </div>
        </div>
      </div>

      <div className="flex gap-2 mb-5">
        <button
          type="button"
          onClick={() => setTab("bloque1")}
          className={`px-4 py-2 rounded-md text-sm font-medium border ${
            tab === "bloque1" ? "bg-slate-800 text-white border-slate-800" : "bg-white text-slate-600 border-slate-300"
          }`}
        >
          Bloque 1 · Captura
        </button>
        <button
          type="button"
          onClick={() => setTab("bloque2")}
          className={`px-4 py-2 rounded-md text-sm font-medium border ${
            tab === "bloque2" ? "bg-slate-800 text-white border-slate-800" : "bg-white text-slate-600 border-slate-300"
          }`}
        >
          Bloque 2 · Gestión de calidad
        </button>
      </div>

      {tab === "bloque1" ? (
        <Bloque1 registros={registros} setRegistros={setRegistros} />
      ) : (
        <Bloque2 registros={registros} />
      )}

      <p className="text-xs text-slate-400 mt-6">
        Prototipo — los datos de esta sesión no se guardan al recargar. La exportación final al formato impreso Q.21
        se genera desde estos mismos campos, tomando como plantilla el .docx oficial.
      </p>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<NCApp />);
</script>
</body>
</html>
